[project]
name = "vscrubber-engine"
version = "0.1.0"
description = "Local AI engine for Video Scrubber: transcription, key frames and moment search"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "pillow>=10.0",
  "yt-dlp>=2025.1.1",
  "huggingface_hub>=0.25",
  "transformers>=4.56",
  "torch>=2.4",
  "torchvision>=0.19",
  "psutil>=5.9",
  "sentence-transformers>=3.0",
  "faster-whisper>=1.1",
  "num2words>=0.5",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Apple Silicon: Whisper and the vision-language describers on the GPU through MLX.
apple = [
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-vlm>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# NVIDIA on Windows/Linux: CUDA libraries CTranslate2 (faster-whisper) loads at runtime.
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# Windows AMD/Intel GPUs without ROCm/XPU wheels.
directml = ["torch-directml"]
