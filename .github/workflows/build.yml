name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            uv: uv-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            uv: uv-x86_64-pc-windows-msvc.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            uv: uv-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the Python engine compiles
        run: python -m compileall -q engine/vscrubber

      # The app uses uv to build the engine's Python environment on first launch,
      # so users don't need Python installed.
      - name: Bundle uv
        shell: bash
        working-directory: src-tauri/bin
        run: |
          curl -LsSf -o uvpkg "https://github.com/astral-sh/uv/releases/latest/download/${{ matrix.uv }}"
          if [[ "${{ matrix.uv }}" == *.zip ]]; then
            unzip -o uvpkg uv.exe
          else
            tar xzf uvpkg && mv uv-*/uv . && rm -rf uv-*/
          fi
          rm uvpkg

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Video Scrubber ${{ github.ref_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: video-scrubber-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: warn
